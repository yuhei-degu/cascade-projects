# Lunaria 製品ゲートCI
# - static: 型チェック+決定的ガードテスト+会話契約チェック(常時・API不要)
# - llm-gate: 会話206+抽出84の大量ゲート(リポジトリシークレット GEMINI_API_KEY がある時だけ)
name: lunaria-gate

on:
  push:
    paths:
      - 'lunaria-app/**'
      - '.github/workflows/lunaria-gate.yml'
  pull_request:
    paths:
      - 'lunaria-app/**'

jobs:
  static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lunaria-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lunaria-app/package-lock.json
      - run: npm ci
      - name: 型チェック
        run: npx tsc --noEmit
      - name: 決定的ガードテスト+会話契約チェック
        run: npm run gate:static

  llm-gate:
    runs-on: ubuntu-latest
    needs: static
    if: ${{ github.event_name == 'push' }}
    defaults:
      run:
        working-directory: lunaria-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lunaria-app/package-lock.json
      - run: npm ci
      - name: シークレット確認
        id: has-key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "GEMINI_API_KEY 未設定のため LLM ゲートをスキップ"
          fi
      - name: 会話ゲート(206ケース)
        if: steps.has-key.outputs.ok == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/eval-mass.mts
      - name: 抽出ゲート(84ケース)
        if: steps.has-key.outputs.ok == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/eval-mass-extraction.mts
      - name: ゲートログを保存
        if: always() && steps.has-key.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: lunaria-app/logs/eval/*.txt
          retention-days: 14
